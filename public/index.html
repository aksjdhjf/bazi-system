<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄机阁 · 八字命理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <div class="brand">
        <span class="taiji"></span>
        <div class="brand-txt">
          <h1>玄机阁<span class="gold">·</span>八字</h1>
          <p class="tagline">排盘论命 · 滴天髓与周易双典合参</p>
        </div>
      </div>
      <button id="themeBtn" class="theme-toggle" title="切换明暗">☾ 暗</button>
    </nav>

    <section class="hero">
      <svg class="bagua" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="98" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="1"/>
        <g id="baguaTrigrams" fill="currentColor" font-size="22" text-anchor="middle" font-family="serif"></g>
      </svg>
      <h2>八字命理<span class="gold">·</span>周易参证</h2>
      <p>填出生信息，即得半文半白之命局解读——通俗可懂，深奥有据</p>
    </section>

    <main id="chat" class="chat"></main>

    <section class="composer">
      <button id="formToggle" class="ghost-btn" title="详细填写">⌨ 详细填写</button>
      <form id="formPanel" class="form-panel" hidden>
        <div class="row">
          <label>公历生日<input type="date" id="fDate" /></label>
          <label>出生时辰<input type="time" id="fTime" /></label>
        </div>
        <div class="row">
          <label>性别
            <select id="fGender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select>
          </label>
          <label>出生城市/地点<input type="text" id="fCity" placeholder="如 杭州 / 绵阳 / 县名均可" /></label>
        </div>
        <div class="row">
          <label class="full">出生经度（选填）<input type="number" id="fLng" step="0.01" min="-180" max="180" placeholder="留空自动估算，如 120.15" /></label>
          <span class="hint">不知经度？填城市即可自动匹配；乡镇按东经120°近似</span>
        </div>
        <button type="submit" class="gold-btn">起 盘 批 命</button>
      </form>
      <form id="msgForm" class="msg-form">
        <input id="msgInput" type="text" placeholder="一句话也行：1990年5月20日下午2点半，男，北京" autocomplete="off" />
        <button type="submit" class="send-btn">起盘</button>
      </form>
      <p class="disclaimer">⚠️ 本工具仅供娱乐与文化研究，不构成任何医疗、法律、投资等建议。</p>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
